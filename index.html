    /* ערכות צבעים מוגדרות על מעטפת האפליקציה לתגובה מיידית וברורה */
    .app-theme-light {
      --app-bg: #F6F4EE;
      --app-surface: #FFFFFF;
      --app-surface-alt: #EDE9DF;
      --app-text: #14213D;
      --app-text-muted: #526077;
      --app-border: #D8D2C5;
      --app-primary: #1B3A6B;
      --app-primary-fg: #FFFFFF;
      --app-accent: #C59B27;
      --app-accent-soft: rgba(197, 155, 39, 0.16);
      --app-success: #15803D;
      --app-success-soft: rgba(21, 128, 61, 0.14);
      --app-danger: #B91C1C;

    .app-theme-dark {
      --app-bg: #0B1120;
      --app-surface: #172033;
      --app-surface-alt: #23304A;
      --app-text: #F8FAFC;
      --app-text-muted: #94A3B8;

      --app-success: #22C55E;
      --app-success-soft: rgba(34, 197, 94, 0.18);
      --app-danger: #EF4444;
    }

    .app-shell {
      background-color: var(--app-bg);
      color: var(--app-text);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-card {
      background-color: var(--app-surface);
      color: var(--app-text);
      border: 1.5px solid var(--app-border);
      transition: all 0.2s ease;
    }

    .app-card-alt {
      background-color: var(--app-surface-alt);
      color: var(--app-text);
      border: 1px solid var(--app-border);
    }

    .app-btn-primary {
      background-color: var(--app-primary);
      color: var(--app-primary-fg);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .app-btn-primary:active {
      transform: scale(0.97);
    }

    .app-btn-secondary {
      background-color: var(--app-surface-alt);
      color: var(--app-text);
      border: 1.5px solid var(--app-border);
      transition: transform 0.12s ease, background-color 0.15s ease;

      color: #FFFFFF;
      transition: transform 0.12s ease;
    }
    .app-btn-success:active {
      transform: scale(0.97);
    }

    .app-text-muted {
      color: var(--app-text-muted);

  <script>
    // ==================== 1. עזרי גימטריה ולוח שנה עברי ====================
    function toGematria(num) {
      if (!num || num <= 0) return String(num);
      let n = Math.floor(num);
      const hundreds = ['', 'ק', 'ר', 'ש', 'ת', 'תק', 'תר', 'תש', 'תת', 'תתק'];
      const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
      const units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
      let out = '';
      if (n >= 1000) {
        out += units[Math.floor(n / 1000) % 10] + '׳';
        n %= 1000;
      }
      if (n >= 100) {
        out += hundreds[Math.floor(n / 100)];
        n %= 100;
      }
      if (n === 15) {
        out += 'טו';
      } else if (n === 16) {
        out += 'טז';
      } else {
        if (n >= 10) {
          out += tens[Math.floor(n / 10)];
          n %= 10;
        }
        if (n > 0) {
          out += units[n];
        }
      }
      if (out.length === 1) return out + '׳';
      if (out.length > 1 && !out.includes('"')) {
        return out.slice(0, -1) + '"' + out.slice(-1);
      }
      return out;
    }

    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayGregorian(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function getHebrewDateInfo(date) {
      try {
        const parts = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }).formatToParts(date);
        const dayNum = parseInt(parts.find(p => p.type === 'day')?.value || '1', 10);
        const monthName = parts.find(p => p.type === 'month')?.value || 'חשוון';
        const yearNum = parseInt(parts.find(p => p.type === 'year')?.value || '5787', 10);
        const dayGematria = toGematria(dayNum);
        const yearShort = toGematria(yearNum % 1000);
        return {
          dayOfMonth: dayNum,
          monthName,
          yearNum,
          formatted: `${dayGematria} ב${monthName} ה׳${yearShort}`
        };
      } catch (e) {
        return { dayOfMonth: 17, monthName: 'חשוון', yearNum: 5787, formatted: 'י"ז בחשוון ה׳תשפ"ז' };
      }
    }

    function getDayOfWeekHe(date) {

      return names[date.getDay()];

    // ==================== בחירת מסכת / פרקים / דף או עמוד ====================
    const SEDER_HE = { 'Seder Zeraim': 'זרעים', 'Seder Moed': 'מועד', 'Seder Nashim': 'נשים', 'Seder Nezikin': 'נזיקין', 'Seder Kodashim': 'קדשים', 'Seder Tahorot': 'טהרות' };
    const SEDER_ID = { 'Seder Zeraim': 'zeraim', 'Seder Moed': 'moed', 'Seder Nashim': 'nashim', 'Seder Nezikin': 'nezikin', 'Seder Kodashim': 'kodashim', 'Seder Tahorot': 'taharot' };

    function gemaraDafCount(g) {
      const firstDaf = Math.floor(g[2] / 2) + 1;
      const lastDaf = Math.floor((g[2] + g[3] - 1) / 2) + 1;
      return lastDaf - firstDaf + 1;
    }

    function enrichTracks() {
      const gem = DEFAULT_TRACKS.find(t => t.id === 'gemara_bavli');
      if (gem) {
        const all = gem.subBooks.find(s => s.id === 'shas_all');
        gem.subBooks = [Object.assign({}, all, { name: 'הדף היומי העולמי / כל הש"ס ברצף', kind: 'gemara', gAll: true })];
        GEMARA_DATA.forEach((g, i) => {
          gem.subBooks.push({ id: g[0].toLowerCase(), name: 'מסכת ' + g[1], units: g[3], ref: g[0], kind: 'gemara', gIdx: i });
        });
      }
      const mis = DEFAULT_TRACKS.find(t => t.id === 'mishna_yomit');
      if (mis) {
        const sedarim = {};
        MISHNAH_DATA.forEach((m, i) => { (sedarim[m[2]] = sedarim[m[2]] || []).push(i); });
        const total = MISHNAH_DATA.reduce((a, m) => a + m[3].length, 0);
        const sb = [{ id: 'shas_mishna', name: 'כל ש"ס משניות (' + total + ' פרקים)', units: total, ref: 'Mishnah_Berakhot', kind: 'mishnah', mIdx: MISHNAH_DATA.map((m, i) => i), group: 'כללי' }];
        Object.keys(SEDER_ID).forEach(sd => {
          const idxs = sedarim[sd] || [];
          const u = idxs.reduce((a, i) => a + MISHNAH_DATA[i][3].length, 0);
          sb.push({ id: SEDER_ID[sd], name: 'סדר ' + SEDER_HE[sd] + ' (' + u + ' פרקים)', units: u, ref: MISHNAH_DATA[idxs[0]][0], kind: 'mishnah', mIdx: idxs, group: 'כללי' });
        });
        MISHNAH_DATA.forEach((m, i) => {
          sb.push({ id: 'm_' + m[0].replace('Mishnah_', '').toLowerCase(), name: 'משנה ' + m[1] + ' (' + m[3].length + ' פרקים)', units: m[3].length, ref: m[0], kind: 'mishnah', mIdx: [i], group: 'סדר ' + (SEDER_HE[m[2]] || '') });
        });
        mis.subBooks = sb;
      }
      const nach = DEFAULT_TRACKS.find(t => t.id === 'nach_yomi');
      if (nach) {
        N_BOOKS_ADD(nach);
      }
    }
    function N_BOOKS_ADD(nach) {
      NACH_DATA.forEach(n => {
        nach.subBooks.push({ id: 'nb_' + n[0].toLowerCase(), name: 'ספר ' + n[1] + ' (' + n[3] + ' פרקים)', units: n[3], ref: n[0], kind: 'chapters', group: n[2] });
      });
    }
    enrichTracks();

    // ---- יחידות לימוד בגמרא: דף או עמוד ----
    function isAmud(track) { return track.id === 'gemara_bavli' && track.pace && track.pace.gemaraUnit === 'amud'; }

    function syncUnitNames(track) {
      if (track.id !== 'gemara_bavli') return;
      if (isAmud(track)) { track.unitSingular = 'עמוד'; track.unitPlural = 'עמודים'; track.minutesPerUnit = 18; }
      else { track.unitSingular = 'דף'; track.unitPlural = 'דפים'; track.minutesPerUnit = 35; }
    }

    // רשימת היחידות המלאה של ספר: לגמרא - עמודים/דפים, למשנה - פרקים
    function gemaraUnitAt(sb, amud, k) {
      // מחזיר {g: מסכת, daf, side} ליחידה מספר k (0-based) בתוך הספר
      const list = sb.gAll ? GEMARA_DATA.map((g, i) => i) : [sb.gIdx];
      for (const gi of list) {
        const g = GEMARA_DATA[gi];
        const cnt = amud ? g[3] : gemaraDafCount(g);
        if (k < cnt) {
          if (amud) {
            const ai = g[2] + k;
            return { g, daf: Math.floor(ai / 2) + 1, side: ai % 2 === 0 ? 'a' : 'b' };
          }
          const firstDaf = Math.floor(g[2] / 2) + 1;
          const daf = firstDaf + k;
          const firstAi = daf * 2 - 2, lastAi = g[2] + g[3] - 1;
          const hasA = firstAi >= g[2];
          const hasB = firstAi + 1 <= lastAi;
          return { g, daf, side: hasA ? 'a' : 'b', hasA, hasB };
        }
        k -= cnt;
      }
      const g = GEMARA_DATA[list[list.length - 1]];
      return { g, daf: Math.floor(g[2] / 2) + 1, side: 'a', hasA: true, hasB: true };
    }

    function mishnahUnitAt(sb, k) {
      for (const mi of sb.mIdx) {
        const m = MISHNAH_DATA[mi];
        if (k < m[3].length) return { m, ch: k + 1 };
        k -= m[3].length;
      }
      const m = MISHNAH_DATA[sb.mIdx[sb.mIdx.length - 1]];
      return { m, ch: m[3].length };
    }

    function sideHe(s) { return s === 'a' ? 'ע"א' : 'ע"ב'; }

    function fullUnitsOf(track, sb) {
      if (sb.kind === 'gemara') {
        const amud = isAmud(track);
        const list = sb.gAll ? GEMARA_DATA : [GEMARA_DATA[sb.gIdx]];
        return list.reduce((a, g) => a + (amud ? g[3] : gemaraDafCount(g)), 0);
      }
      return sb.units;
    }

    // תווית קצרה ליחידה בודדת (עבור בחירת טווח); idx הוא 1-based
    function unitLabelAt(track, sb, idx) {
      if (sb.kind === 'gemara') {
        const u = gemaraUnitAt(sb, isAmud(track), idx - 1);
        const nm = sb.gAll ? u.g[1] + ' ' : '';
        return isAmud(track) ? `${nm}דף ${toGematria(u.daf)} ${sideHe(u.side)}` : `${nm}דף ${toGematria(u.daf)}`;
      }
      if (sb.kind === 'mishnah') {
        const u = mishnahUnitAt(sb, idx - 1);
        return (sb.mIdx.length > 1 ? u.m[1] + ' ' : '') + 'פרק ' + toGematria(u.ch);
      }
      return track.unitSingular.split('/')[0] + ' ' + toGematria(idx);
    }

    // תווית וקישור ל-Sefaria לטווח יחידות מוחלט (1-based)
    function portionForRange(track, sb, a, b) {
      if (sb.kind === 'gemara') {
        const amud = isAmud(track);
        const ua = gemaraUnitAt(sb, amud, a - 1), ub = gemaraUnitAt(sb, amud, b - 1);
        const same = ua.g === ub.g;
        let label;
        if (a === b) {
          label = amud
            ? `${ua.g[1]} – דף ${toGematria(ua.daf)} ${sideHe(ua.side)}`
            : `${ua.g[1]} – דף ${toGematria(ua.daf)} ${ua.hasA && ua.hasB ? 'ע"א–ע"ב' : sideHe(ua.side)}`;
        } else if (amud) {
          label = `${ua.g[1]} דף ${toGematria(ua.daf)} ${sideHe(ua.side)} – ${same ? '' : ub.g[1] + ' '}דף ${toGematria(ub.daf)} ${sideHe(ub.side)}`;
        } else {
          label = `${ua.g[1]} – דפים ${toGematria(ua.daf)}–${same ? '' : ub.g[1] + ' '}${toGematria(ub.daf)}`;
        }
        return { label, ref: `${ua.g[0]}.${ua.daf}${ua.side}` };
      }
      if (sb.kind === 'mishnah') {
        const ua = mishnahUnitAt(sb, a - 1), ub = mishnahUnitAt(sb, b - 1);
        let label;
        if (a === b) label = `משנה ${ua.m[1]} – פרק ${toGematria(ua.ch)}`;
        else if (ua.m === ub.m) label = `משנה ${ua.m[1]} – פרקים ${toGematria(ua.ch)}–${toGematria(ub.ch)}`;
        else label = `משנה ${ua.m[1]} פרק ${toGematria(ua.ch)} – ${ub.m[1]} פרק ${toGematria(ub.ch)}`;
        return { label, ref: `${ua.m[0]}.${ua.ch}` };
      }
      return null;
    }

    // ==================== 3. ניהול State, ערכת צבעים ו-localStorage ====================

          state.readerFontSize = parsed.readerFontSize || 20;
          state.showCommentaries = parsed.showCommentaries !== undefined ? parsed.showCommentaries : true;
          state.reminderTime = parsed.reminderTime || '20:30';
          state.reminderEnabled = parsed.reminderEnabled !== undefined ? parsed.reminderEnabled : true;
          state.lastReminderFiredDate = parsed.lastReminderFiredDate || '';
          state.syncUserId = parsed.syncUserId || '';
          state.lastCloudKey = parsed.lastCloudKey || '';
          state.lastSyncTimeStr = parsed.lastSyncTimeStr || '';
          state.plannerSelectedTrackId = parsed.plannerSelectedTrackId || 'kuzari';
          state.completedMap = parsed.completedMap || {};
          state.notes = parsed.notes || [];

          const savedMap = {};
          (parsed.tracks || []).forEach(t => { savedMap[t.id] = t; });
          state.tracks = DEFAULT_TRACKS.map((def, idx) => {
            const saved = savedMap[def.id];
            if (!saved) return JSON.parse(JSON.stringify({ ...def, order: idx }));
            return {
              ...JSON.parse(JSON.stringify(def)),
              enabled: saved.enabled !== undefined ? saved.enabled : def.enabled,
              isCore: saved.isCore !== undefined ? saved.isCore : def.isCore,
              order: saved.order !== undefined ? saved.order : idx,
              pace: { ...def.pace, ...(saved.pace || {}) }
            };
          }).sort((a, b) => a.order - b.order);
          state.tracks.forEach(syncUnitNames);
        } else {
          state.tracks = JSON.parse(JSON.stringify(DEFAULT_TRACKS)).map((t, i) => ({ ...t, order: i }));
        }

        // בדיקה אם הקישור נפתח עם פרמטר סנכרון אוטומטי (?sync=...)
        const urlParams = new URLSearchParams(window.location.search);
        const syncFromUrl = urlParams.get('sync');
        if (syncFromUrl && syncFromUrl.trim()) {
          state.syncUserId = syncFromUrl.trim();
        }
      } catch (e) {
        state.tracks = JSON.parse(JSON.stringify(DEFAULT_TRACKS)).map((t, i) => ({ ...t, order: i }));
      }
      applyThemeToDOM();
    }

    function buildSyncPayload() {
      return {
        version: 3,
        updatedAt: Date.now(),
        themeMode: state.themeMode,
        busyDayMode: state.busyDayMode,
        readerFontSize: state.readerFontSize,
        showCommentaries: state.showCommentaries,
        reminderTime: state.reminderTime,
        reminderEnabled: state.reminderEnabled,
        lastReminderFiredDate: state.lastReminderFiredDate,
        syncUserId: state.syncUserId,
        lastCloudKey: state.lastCloudKey,
        lastSyncTimeStr: state.lastSyncTimeStr,
        plannerSelectedTrackId: state.plannerSelectedTrackId,
        completedMap: state.completedMap,
        notes: state.notes,
        tracks: state.tracks.map(t => ({
          id: t.id,
          enabled: t.enabled,
          isCore: t.isCore,
          order: t.order,
          pace: t.pace
        }))
      };
    }

    function saveState(skipCloudAutoPush = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSyncPayload()));
      } catch (e) {}

      if (!skipCloudAutoPush && state.syncUserId) {
        clearTimeout(window._cloudSyncDebounce);
        window._cloudSyncDebounce = setTimeout(() => {
          pushStateToCloud(true);
        }, 1200);
      }
    }

    // זיהוי האם ברירת המחדל של הטלפון/המערכת היא מצב כהה
    function isSystemDark() {
      if (document.documentElement.classList.contains('dark')) return true;
      if (document.documentElement.classList.contains('light')) return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function applyThemeToDOM() {
      const root = document.getElementById('appRoot');
      let effectiveDark = false;
      if (state.themeMode === 'dark') {
        effectiveDark = true;
      } else if (state.themeMode === 'light') {
        effectiveDark = false;
      } else {
        effectiveDark = isSystemDark();
      }

      root.classList.remove('app-theme-light', 'app-theme-dark');
      root.classList.add(effectiveDark ? 'app-theme-dark' : 'app-theme-light');

      // עדכון כפתור ערכת הצבעים המהיר בראש העמוד
      const iconEl = document.getElementById('quickThemeIcon');
      const labelEl = document.getElementById('quickThemeLabel');
      if (iconEl && labelEl) {
        if (state.themeMode === 'light') {
          iconEl.textContent = '☀️';
          labelEl.textContent = 'בהיר';
        } else if (state.themeMode === 'dark') {
          iconEl.textContent = '🌙';
          labelEl.textContent = 'כהה';
        } else {
          iconEl.textContent = '📱';
          labelEl.textContent = 'אוטומטי';
        }
      }
    }

    function setThemeMode(mode) {
      state.themeMode = mode;
      saveState();
      applyThemeToDOM();
      renderCurrentPage();
      const names = { light: 'ערכת צבעים בהירה ☀️', dark: 'ערכת צבעים כהה (מצב לילה) 🌙', system: 'ברירת מחדל כמו הטלפון 📱' };
      showToast(`עברת ל${names[mode]}`);
    }

    function cycleThemeQuick() {
      const order = ['light', 'dark', 'system'];
      const next = order[(order.indexOf(state.themeMode) + 1) % order.length];
      setThemeMode(next);
    }

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (state.themeMode === 'system') applyThemeToDOM();
      });
    }

    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      const text = document.getElementById('toastText');
      if (!banner || !text) return;
      text.textContent = msg;
      banner.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2400);
    }

    // ==================== 4. חישוב המנה היומית וקצב סיום ====================
    function getBaseSubBook(track) {
      return track.subBooks.find(sb => sb.id === track.pace.subBookId) || track.subBooks[0];
    }

    // הספר הנבחר כולל טווח (מ-עד) ויחידה (דף/עמוד): units = אורך הטווח
    function getSelectedSubBook(track) {
      const base = getBaseSubBook(track);
      const full = fullUnitsOf(track, base);
      let from = parseInt(track.pace.rangeFrom, 10) || 1;
      let to = parseInt(track.pace.rangeTo, 10) || full;
      from = Math.min(Math.max(1, from), full);
      to = Math.min(Math.max(from, to), full);
      return Object.assign({}, base, { units: to - from + 1, fullUnits: full, rangeFrom: from, rangeTo: to });
    }

    function countActiveDaysBetween(startStr, endStr, excludeFriday, excludeShabbat) {
      const s = new Date(startStr + 'T00:00:00');
      const e = new Date(endStr + 'T00:00:00');
      if (e <= s) return 0;
      const totalDays = Math.round((e - s) / 86400000);
      if (!excludeFriday && !excludeShabbat) return totalDays;
      let count = 0;
      const cur = new Date(s);
      for (let i = 0; i < totalDays; i++) {
        const day = cur.getDay();
        if (excludeFriday && day === 5) { cur.setDate(cur.getDate() + 1); continue; }
        if (excludeShabbat && day === 6) { cur.setDate(cur.getDate() + 1); continue; }
        count++;
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    }

    function resolveDailyUnits(track, subBook) {
      const p = track.pace;
      const remainingTotal = Math.max(1, subBook.units - (p.offset || 0));
      if (p.mode === 'global') return p.dailyUnits || 1;
      if (p.mode === 'days') return remainingTotal / Math.max(1, p.targetDays || 90);
      if (p.mode === 'date') {
        const targetStr = p.targetDate || toDateKey(new Date(Date.now() + 90 * 86400000));
        const activeDays = Math.max(1, countActiveDaysBetween(p.startDate || toDateKey(new Date()), targetStr, p.excludeFriday, p.excludeShabbat));
        return remainingTotal / activeDays;
      }
      return Math.max(0.25, p.dailyUnits || 1);
    }

    function computeDailyPortion(track, dateStr) {
      const subBook = getSelectedSubBook(track);
      const p = track.pace;
      const dateObj = new Date(dateStr + 'T12:00:00');
      const hebInfo = getHebrewDateInfo(dateObj);
      const parasha = getParashaForDate(dateObj);
      const dayOfWeek = dateObj.getDay();

      const isReviewDay = p.mode !== 'global' && ((p.excludeFriday && dayOfWeek === 5) || (p.excludeShabbat && dayOfWeek === 6));
      const activeElapsed = countActiveDaysBetween(p.startDate || '2026-01-01', dateStr, p.mode !== 'global' && p.excludeFriday, p.mode !== 'global' && p.excludeShabbat);
      const unitsPerDay = resolveDailyUnits(track, subBook);

      const startFloat = (p.offset || 0) + activeElapsed * unitsPerDay;
      const startUnit = (Math.floor(startFloat) % subBook.units) + 1;
      const span = Math.max(1, Math.ceil(unitsPerDay));
      const endUnit = Math.min(subBook.units, startUnit + span - 1);

      const completedUnits = Math.min(subBook.units, Math.max(0, startUnit - 1));
      const progressPct = Math.min(100, Math.round((startUnit / subBook.units) * 100));
      const remainingUnits = Math.max(0, subBook.units - completedUnits);
      const daysRemaining = unitsPerDay > 0 ? Math.ceil(remainingUnits / unitsPerDay) : 0;

      const estFinishDate = new Date(dateObj.getTime() + daysRemaining * 86400000);
      const estFinishHeb = getHebrewDateInfo(estFinishDate).formatted;

      let portionLabel = '';
      let sefariaRef = `${subBook.ref}.${startUnit}`;

      const calCache = state.sefariaCalendarCache[dateStr] || [];
      const calendarBook = !(track.id === 'gemara_bavli' || track.id === 'mishna_yomit') ||
        ((subBook.id === 'shas_all' || subBook.id === 'shas_mishna') && subBook.rangeFrom === 1 && subBook.rangeTo === subBook.fullUnits && !isAmud(track));
      const liveItem = (p.mode === 'global' && track.sefariaCalendarTitle && calendarBook)
        ? calCache.find(c => (c.title?.en || '').toLowerCase() === track.sefariaCalendarTitle.toLowerCase())
        : null;

      if (isReviewDay) {
        portionLabel = `יום חזרה ושינון שבועי (עד ${track.unitSingular} ${toGematria((subBook.rangeFrom || 1) - 1 + startUnit)})`;
      } else if (liveItem && liveItem.displayValue?.he) {
        portionLabel = liveItem.displayValue.he;
        sefariaRef = liveItem.ref || sefariaRef;
      } else if (track.id === 'torah_yomi' && subBook.id === 'parasha_aliya') {
        const aliyot = ['עליית ראשון', 'עליית שני', 'עליית שלישי', 'עליית רביעי', 'עליית חמישי', 'עליית שישי ושביעי', 'קריאת הפרשה והפטרה'];
        portionLabel = `פרשת ${parasha} – ${aliyot[dayOfWeek]} (שניים מקרא ורש"י)`;
      } else if (track.id === 'tehillim_yomi' && subBook.id === 'tehillim_month' && p.mode === 'global') {
        const idx = Math.max(0, Math.min(29, hebInfo.dayOfMonth - 1));
        const [fromCh, toCh] = TEHILLIM_MONTHLY[idx];
        if (fromCh === 119) {
          portionLabel = `יום ${toGematria(hebInfo.dayOfMonth)} בחודש: פרק קי"ט (${idx === 24 ? 'אותיות א׳–נ"ו' : 'אותיות צ"ז–קע"ו'})`;
          sefariaRef = 'Psalms.119';
        } else {
          portionLabel = `יום ${toGematria(hebInfo.dayOfMonth)} בחודש: פרקים ${toGematria(fromCh)}–${toGematria(toCh)}`;
          sefariaRef = `Psalms.${fromCh}-${toCh}`;
        }
      } else if (track.id === 'chok_leisrael') {
        portionLabel = `פרשת ${parasha} – ${getDayOfWeekHe(dateObj)}`;
      } else if (subBook.kind === 'gemara' || subBook.kind === 'mishnah') {
        const pr = portionForRange(track, subBook, subBook.rangeFrom - 1 + startUnit, subBook.rangeFrom - 1 + endUnit);
        portionLabel = pr.label;
        sefariaRef = pr.ref;
      } else {
        const bookShort = subBook.name.split('(')[0].trim();
        const absStart = (subBook.rangeFrom || 1) - 1 + startUnit;
        const absEnd = (subBook.rangeFrom || 1) - 1 + endUnit;
        sefariaRef = `${subBook.ref}.${absStart}`;
        if (endUnit > startUnit) {
          portionLabel = `${bookShort} • ${track.unitPlural} ${toGematria(absStart)}–${toGematria(absEnd)}`;
        } else {
          portionLabel = `${bookShort} • ${track.unitSingular} ${toGematria(absStart)}`;
        }
      }

      const isCompleted = !!state.completedMap[`${dateStr}::${track.id}`];
      const estMinutes = isReviewDay ? 10 : Math.max(4, Math.round(track.minutesPerUnit * Math.min(3, Math.max(0.7, unitsPerDay))));

      return {
        track,
        subBook,
        dateStr,
        portionLabel,
        sefariaRef,
        startUnit,
        totalUnits: subBook.units,
        progressPct,
        daysRemaining,
        estFinishHeb,
        isCompleted,
        isReviewDay,
        estMinutes,
        unitsPerDay
      };
    }

    function calculateStreak() {
      let streak = 0;
      const cursor = new Date();
      for (let i = 0; i < 365; i++) {
        const dKey = toDateKey(cursor);
        const anyDone = Object.keys(state.completedMap).some(k => k.startsWith(dKey + '::') && state.completedMap[k]);
        if (anyDone) {
          streak++;
          cursor.setDate(cursor.getDate() - 1);
        } else {
          if (i === 0) {
            cursor.setDate(cursor.getDate() - 1);
            continue;
          }
          break;
        }
      }
      return streak;
    }

    function getMissedPortions() {
      const missed = [];
      const today = new Date();
      const coreTracks = state.tracks.filter(t => t.enabled && t.isCore);
      for (let daysAgo = 1; daysAgo <= 7; daysAgo++) {
        const d = new Date(today.getTime() - daysAgo * 86400000);
        const dKey = toDateKey(d);
        const hebLabel = getHebrewDateInfo(d).formatted;
        coreTracks.forEach(track => {
          if (!state.completedMap[`${dKey}::${track.id}`]) {
            const p = computeDailyPortion(track, dKey);
            if (!p.isReviewDay) {
              missed.push({
                dateKey: dKey,
                hebLabel,
                trackId: track.id,
                trackTitle: track.titleHe,
                trackIcon: track.icon,
                portionLabel: p.portionLabel
              });
            }
          }
        });
      }
      return missed;
    }

    async function tryFetchSefariaCalendar(dateStr) {
      if (state.sefariaCalendarCache[dateStr]) return;
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const resp = await fetch(`https://www.sefaria.org/api/calendars?year=${y}&month=${m}&day=${d}&diaspora=0`);
        if (resp.ok) {
          const data = await resp.json();
          if (data && Array.isArray(data.calendar_items)) {
            state.sefariaCalendarCache[dateStr] = data.calendar_items;
            renderCurrentPage();
          }
        }
      } catch (e) {}
    }

    // ==================== 5. ניווט בין דפים ייעודיים ====================
    function navigateToPage(pageName, extraParam) {
      if (pageName === 'planner' && extraParam) {
        state.plannerSelectedTrackId = extraParam;
      }
      if (pageName === 'reader' && extraParam) {
        state.readerActiveTrackId = extraParam;
      }
      state.currentPage = pageName;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const streak = calculateStreak();
      document.getElementById('headerStreakText').textContent = `${streak} ימים`;

      const missed = getMissedPortions();
      const badge = document.getElementById('navMissedBadge');
      if (missed.length > 0) {
        badge.textContent = missed.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      // עדכון כותרות הסרגל העליון לפי הדף הנוכחי
      const titles = {
        today: ['הלימוד היומי שלי', 'לוח לימוד יומי מותאם אישית'],
        catalog: ['בחירת ספרים ומסלולים', 'הפעל או כבה ספרים וקבע את סדרם'],
        planner: ['תכנון קצב וזמן סיום', 'קבע בכמה זמן תרצה לסיים כל ספר וכרך'],
        catchup: ['השלמות ומחברת חידושים', 'מעקב חובות לימוד וכתיבת חידושי תורה'],
        settings: ['עיצוב והגדרות תצוגה', 'ערכת צבעים, גודל גופן ותזכורת יומית'],
        reader: ['קריאה ולימוד יומי', 'טקסט הלימוד עם מפרשים וכתיבת חידוש']
      };
      const [tTitle, tSub] = titles[state.currentPage] || titles.today;
      document.getElementById('topBarTitle').textContent = tTitle;
      document.getElementById('topBarSubtitle').textContent = tSub;

      // הדגשת הכפתור הפעיל בסרגל הניווט התחתון
      const navPages = ['today', 'catalog', 'planner', 'catchup', 'settings'];
      const activeNav = state.currentPage === 'reader' ? 'today' : state.currentPage;
      navPages.forEach(p => {
        const btn = document.getElementById('navBtn-' + p);
        if (!btn) return;
        if (p === activeNav) {
          btn.className = 'py-2 px-1 rounded-2xl flex flex-col items-center justify-center gap-1 app-btn-primary shadow-md relative';
        } else {
          btn.className = 'py-2 px-1 rounded-2xl flex flex-col items-center justify-center gap-1 app-text-muted hover:opacity-80 relative';
        }
      });

      const container = document.getElementById('pageContainer');
      if (state.currentPage === 'today') {
        renderTodayPage(container);
      } else if (state.currentPage === 'catalog') {
        renderCatalogPage(container);
      } else if (state.currentPage === 'planner') {
        renderPlannerPage(container);
      } else if (state.currentPage === 'catchup') {
        renderCatchupAndNotesPage(container, missed);
      } else if (state.currentPage === 'settings') {
        renderSettingsPage(container);
      } else if (state.currentPage === 'reader') {
        renderReaderPage(container);
      }
    }

    // ==================== דף 1: הלימוד היום (לוח יומי) ====================
    function renderTodayPage(container) {
      const selDate = new Date(state.selectedDateStr + 'T12:00:00');
      const hebInfo = getHebrewDateInfo(selDate);
      const dayOfWeekHe = getDayOfWeekHe(selDate);
      const parasha = getParashaForDate(selDate);
      const isToday = state.selectedDateStr === toDateKey(new Date());

      const enabledTracks = state.tracks.filter(t => t.enabled && (!state.busyDayMode || t.isCore));
      const allPortions = enabledTracks.map(t => computeDailyPortion(t, state.selectedDateStr));
      const filteredPortions = state.categoryFilter === 'הכל'
        ? allPortions
        : allPortions.filter(p => p.track.category === state.categoryFilter);

      const doneCount = allPortions.filter(p => p.isCompleted).length;
      const totalCount = allPortions.length;
      const pctToday = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
      const remainingMins = allPortions.filter(p => !p.isCompleted).reduce((acc, p) => acc + p.estMinutes, 0);

      const categories = ['הכל', 'גמרא ומשנה', 'תורה ונ"ך', 'הלכה', 'מחשבה ומוסר', 'חסידות וקבלה'];

      container.innerHTML = `
        <div class="page-animate space-y-4">

          <!-- כרטיס תאריך עברי וניווט מהיר בין ימים עם כפתורים גדולים -->
          <section class="app-card rounded-3xl p-4 shadow-sm space-y-3.5">
            <div class="text-center space-y-1">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold" style="background-color: var(--app-accent-soft); color: var(--app-text);">
                <span>🕯️ פרשת ${parasha}</span>
                <span>•</span>
                <span>${formatDisplayGregorian(state.selectedDateStr)}</span>
              </div>
              <h2 class="text-xl font-extrabold">${dayOfWeekHe}, ${hebInfo.formatted}</h2>
            </div>

            <!-- 3 כפתורי ניווט תאריך גדולים וברורים -->
            <div class="grid grid-cols-3 gap-2.5">
              <button onclick="shiftDate(-1)" class="py-3 px-3 rounded-2xl app-btn-secondary font-bold text-sm flex items-center justify-center gap-1.5">
                <span>▶</span>
                <span>יום קודם</span>
              </button>
              <button onclick="goToToday()" class="py-3 px-3 rounded-2xl ${isToday ? 'app-btn-primary' : 'app-btn-secondary'} font-bold text-sm flex items-center justify-center gap-1.5">
                <span>📍</span>
                <span>היום</span>
              </button>
              <button onclick="shiftDate(1)" class="py-3 px-3 rounded-2xl app-btn-secondary font-bold text-sm flex items-center justify-center gap-1.5">
                <span>יום הבא</span>
                <span>◀</span>
              </button>
            </div>

            <!-- מד ההספק היומי -->
            <div class="app-card-alt rounded-2xl p-3.5 space-y-2">
              <div class="flex items-center justify-between text-sm font-bold">
                <span>הספק יומי: ${doneCount} מתוך ${totalCount} הושלמו</span>
                <span>${pctToday}%</span>
              </div>
              <div class="w-full h-3.5 rounded-full overflow-hidden" style="background-color: var(--app-border);">
                <div class="h-full transition-all duration-300 rounded-full" style="width: ${pctToday}%; background-color: var(--app-success);"></div>
              </div>
              <div class="flex items-center justify-between text-xs app-text-muted font-semibold pt-0.5">
                <span>${remainingMins === 0 && totalCount > 0 ? '🎉 אשריך! השלמת את כל הקביעות להיום!' : `⏱️ זמן לימוד משוער שנותר: כ-${remainingMins} דקות`}</span>
                ${doneCount < totalCount && totalCount > 0 ? `<button onclick="markAllTodayCompleted()" class="underline font-bold" style="color: var(--app-primary);">סמן הכל כנלמד</button>` : ''}
              </div>
            </div>

            <!-- כפתור מצב "עמוס היום" גדול וברור -->
            <button onclick="toggleBusyDayMode()" class="w-full py-3 px-4 rounded-2xl font-bold text-sm flex items-center justify-between ${state.busyDayMode ? 'app-btn-primary shadow-md' : 'app-btn-secondary'}">
              <span class="flex items-center gap-2">
                <span class="text-lg">⚡</span>
                <span>מצב "עמוס היום" (הצג לימודי ליבה בלבד)</span>
              </span>
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold" style="background-color: rgba(0,0,0,0.15);">
                ${state.busyDayMode ? 'פעיל ✓' : 'כבוי'}
              </span>
            </button>
          </section>

          <!-- סרגל סינון קטגוריות עם כפתורים נוחים -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            ${categories.map(cat => `

    function renderDailyCardHtml(p) {

        date: 'עד תאריך יעד',
        daily: `${p.track.pace.dailyUnits} ${p.track.unitPlural} ביום`
      };
      const modeBadge = modeNames[p.track.pace.mode] || 'לוח קבוע';

      return `
        <article class="app-card rounded-3xl p-4 shadow-sm space-y-3.5" style="${p.isCompleted ? 'border-color: var(--app-success); border-width: 2px;' : ''}">
          <!-- שורה עליונה: קטגוריה, ליבה, וזמן משוער -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-2xl">${p.track.icon}</span>
              <span class="px-2.5 py-1 rounded-xl text-xs font-bold app-card-alt">${p.track.category}</span>
              ${p.track.isCore ? `<span class="px-2.5 py-1 rounded-xl text-xs font-bold" style="background-color: var(--app-accent-soft);">⭐ ליבה</span>` : ''}
            </div>
            <span class="px-2.5 py-1 rounded-xl text-xs font-bold app-card-alt">⏱️ ~${p.estMinutes} דק׳</span>
          </div>

          <!-- כותרת הספר והמנה היומית -->
          <div class="space-y-1">
            <h3 class="font-extrabold text-lg leading-snug ${p.isCompleted ? 'line-through opacity-75' : ''}">
              ${p.track.titleHe}
            </h3>
            <p class="font-bold text-base leading-snug" style="color: var(--app-primary);">
              📍 ${p.portionLabel}
            </p>
          </div>

          <!-- פס התקדמות בספר + כפתור שינוי קצב -->
          <div class="app-card-alt rounded-2xl p-3 space-y-2">
            <div class="flex items-center justify-between text-xs font-bold">
              <span>התקדמות בספר: ${p.progressPct}%</span>
              <span>סיום: ${p.estFinishHeb} (עוד ${p.daysRemaining} ימים)</span>

            <div class="w-full h-2 rounded-full overflow-hidden" style="background-color: var(--app-border);">
              <div class="h-full rounded-full" style="width: ${p.progressPct}%; background-color: var(--app-primary);"></div>
            </div>
            <div class="flex items-center justify-between pt-1">
              <span class="text-xs app-text-muted font-semibold">קצב נוכחי: ${modeBadge}</span>
              <button onclick="navigateToPage('planner', '${p.track.id}')" class="px-3 py-1.5 rounded-xl app-card text-xs font-bold hover:opacity-80">
                ⏱️ שנה זמן סיום / כרך
              </button>
            </div>
          </div>

          <!-- 2 כפתורי פעולה ראשיים גדולים וברורים -->
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button onclick="navigateToPage('reader', '${p.track.id}')" class="py-3.5 px-3 rounded-2xl app-btn-primary font-bold text-sm flex items-center justify-center gap-2 shadow-sm">
              <span class="text-base">📖</span>
              <span>פתח לקריאה</span>
            </button>

            <button onclick="togglePortionComplete('${p.track.id}')" class="py-3.5 px-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-sm ${p.isCompleted ? 'app-btn-success' : 'app-btn-secondary'}">
              <span class="text-base">${p.isCompleted ? '✓' : '⭕'}</span>
              <span>${p.isCompleted ? 'נלמד היום!' : 'סמן "למדתי"'}</span>
            </button>
          </div>
        </article>
      `;
    }

    // ==================== דף 2: קטלוג ספרים (בחירה וסידור) ====================

              <button onclick="navigateToPage('today')" class="py-2.5 rounded-2xl app-btn-primary text-xs font-bold">📅 חזור ללוח היומי</button>

          <!-- סינון קטגוריות בקטלוג -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">

                    </button>

                    <button onclick="navigateToPage('planner', '${track.id}')" class="py-3 px-3 rounded-2xl app-btn-secondary font-bold text-sm flex items-center justify-center gap-1.5">

                      <span>בחר כרך וקצב</span>
                    </button>

                      <button onclick="toggleTrackCore('${track.id}')" class="px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 ${track.isCore ? 'app-btn-primary' : 'app-btn-secondary'}">
                        <span>⭐</span>
                        <span>${track.isCore ? 'לימוד ליבה (חובה)' : 'הגדר כלימוד ליבה'}</span>
                      </button>

                      <div class="flex items-center gap-1.5">
                        <span class="text-xs app-text-muted font-semibold ml-1">סדר:</span>
                        <button onclick="moveTrack(${realIdx}, -1)" class="px-3 py-2 rounded-xl app-btn-secondary text-xs font-bold" title="הזז למעלה">▲ למעלה</button>

    // ==================== דף 3: תכנון קצב וזמן סיום ("בכמה זמן לסיים") ====================
    function renderPlannerPage(container) {
      const track = state.tracks.find(t => t.id === state.plannerSelectedTrackId) || state.tracks[0];
      const p = track.pace;
      const subBook = getSelectedSubBook(track);
      const perDay = resolveDailyUnits(track, subBook);
      const remainingUnits = Math.max(1, subBook.units - (p.offset || 0));
      const daysToFinish = perDay > 0 ? Math.ceil(remainingUnits / perDay) : 0;
      const finishDate = new Date(Date.now() + daysToFinish * 86400000);
      const finishHeb = getHebrewDateInfo(finishDate).formatted;

      const dayPresets = [
        { label: 'חודש (30 יום)', days: 30 },
        { label: 'חודשיים (60 יום)', days: 60 },
        { label: '3 חודשים (90 יום)', days: 90 },
        { label: 'חצי שנה (180 יום)', days: 180 },
        { label: 'שנה (365 יום)', days: 365 },
        { label: 'שנתיים (730 יום)', days: 730 }
      ];

      const dailyUnitPresets = [1, 2, 3, 4, 5, 10];

      container.innerHTML = `
        <div class="page-animate space-y-4">

          <!-- שלב 1: בחירת הספר והכרך/המסכת -->

            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold app-text-muted block">קטגוריה / ספר ראשי:</label>
              <select onchange="selectPlannerTrack(this.value)" class="w-full rounded-2xl p-3.5 text-base font-bold app-card-alt focus:outline-none">
                ${state.tracks.map(t => `
                  <option value="${t.id}" ${t.id === track.id ? 'selected' : ''}>${t.icon} ${t.titleHe}</option>
                `).join('')}
              </select>
            </div>

            <div class="space-y-2 pt-1">
              <label class="text-xs font-bold app-text-muted block">בחר ${track.id === 'gemara_bavli' ? 'מסכת' : track.id === 'mishna_yomit' ? 'סדר או מסכת' : 'כרך / ספר'} מתוך "${track.titleHe}":</label>
              <select onchange="updatePlannerSubBook(this.value)" class="w-full rounded-2xl p-3.5 text-sm font-bold app-card-alt focus:outline-none">
                ${renderSubBookOptions(track, p)}
              </select>
            </div>

            ${track.id === 'gemara_bavli' ? `
              <div class="space-y-2 pt-1">
                <label class="text-xs font-bold app-text-muted block">יחידת לימוד יומית:</label>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="setGemaraUnit('daf')" class="py-3 rounded-2xl font-extrabold text-sm ${!isAmud(track) ? 'app-btn-primary' : 'app-btn-secondary'}">📜 דף (ע"א + ע"ב)</button>
                  <button onclick="setGemaraUnit('amud')" class="py-3 rounded-2xl font-extrabold text-sm ${isAmud(track) ? 'app-btn-primary' : 'app-btn-secondary'}">📄 עמוד אחד</button>
                </div>
              </div>
            ` : ''}

            ${renderRangePicker(track, subBook)}

          <!-- שלב 2: בחירת שיטת החישוב (4 כפתורי ענק ברורים) -->
          <section class="app-card rounded-3xl p-4 space-y-3 shadow-sm">
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 rounded-full app-btn-primary flex items-center justify-center text-xs font-extrabold">2</span>

              <button onclick="setPlannerMode('global')" class="p-3.5 rounded-2xl text-right space-y-1 ${p.mode === 'global' ? 'app-btn-primary shadow-md' : 'app-btn-secondary'}">
                <div class="text-xl">🌍</div>
                <div class="font-extrabold text-sm">לוח עולמי קבוע</div>
                <div class="text-xs opacity-80">סנכרון עם המחזור העולמי</div>
              </button>

              <button onclick="setPlannerMode('days')" class="p-3.5 rounded-2xl text-right space-y-1 ${p.mode === 'days' ? 'app-btn-primary shadow-md' : 'app-btn-secondary'}">

                  ${dayPresets.map(pr => `
                    <button onclick="setPlannerTargetDays(${pr.days})" class="py-3 px-3 rounded-2xl font-bold text-xs ${p.targetDays === pr.days ? 'app-btn-primary' : 'app-btn-secondary'}">
                      ${pr.label}
                    </button>
                  `).join('')}
                </div>
                <div class="app-card-alt rounded-2xl p-3 flex items-center justify-between gap-2">
                  <button onclick="setPlannerTargetDays(${Math.max(5, (p.targetDays || 90) - 10)})" class="w-12 h-11 rounded-xl app-card font-extrabold text-lg">-10</button>
                  <div class="text-center">
                    <div class="text-lg font-extrabold">${p.targetDays} ימים</div>
                    <div class="text-xs app-text-muted">מותאם אישית</div>
                  </div>
                  <button onclick="setPlannerTargetDays(${(p.targetDays || 90) + 10})" class="w-12 h-11 rounded-xl app-card font-extrabold text-lg">+10</button>

            ${p.mode === 'daily' ? `

                <div class="grid grid-cols-3 gap-2">
                  ${dailyUnitPresets.map(u => `
                    <button onclick="setPlannerDailyUnits(${u})" class="py-3 rounded-2xl font-bold text-sm ${p.dailyUnits === u ? 'app-btn-primary' : 'app-btn-secondary'}">
                      ${u} ${track.unitPlural}

                </div>
              </div>

            ${p.mode === 'date' ? `
              <div class="pt-3 border-t border-[var(--app-border)] space-y-2.5">
                <label class="text-sm font-extrabold block">בחר תאריך יעד לסיום הספר:</label>

              </div>
            ` : ''}

            ${p.mode !== 'global' ? `
              <div class="pt-3 border-t border-[var(--app-border)] space-y-2">
                <div class="text-xs font-bold app-text-muted">ימי חזרה והשלמה שבועיים (ללא חומר חדש):</div>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="togglePlannerExclude('friday')" class="py-3 px-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5 ${p.excludeFriday ? 'app-btn-primary' : 'app-btn-secondary'}">
                    <span>${p.excludeFriday ? '✓' : '⭕'}</span>
                    <span>ללא יום שישי</span>
                  </button>
                  <button onclick="togglePlannerExclude('shabbat')" class="py-3 px-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5 ${p.excludeShabbat ? 'app-btn-primary' : 'app-btn-secondary'}">
                    <span>${p.excludeShabbat ? '✓' : '⭕'}</span>
                    <span>ללא שבת קודש</span>
                  </button>
                </div>
              </div>
            ` : ''}
          </section>

          <!-- שלב 3: סיכום תוכנית הסיום וכפתורי שמירה -->
          <section class="app-card rounded-3xl p-4 space-y-3.5 shadow-sm" style="border-color: var(--app-primary); border-width: 2px;">

              <span>📊</span>
              <span>סיכום תוכנית הסיום שלך:</span>

            <div class="app-card-alt rounded-2xl p-3.5 space-y-1.5 text-sm">

              <div class="flex justify-between pt-1 border-t border-[var(--app-border)]">

                <span>💾</span>
                <span>שמור תוכנית ועבור ללוח היומי</span>
              </button>
            </div>
          </section>

        </div>
      `;

      container.innerHTML = `

    function renderSubBookOptions(track, p) {
      const groups = [];
      track.subBooks.forEach(sb => {
        const g = sb.group || '';
        let grp = groups.find(x => x.g === g);
        if (!grp) { grp = { g, items: [] }; groups.push(grp); }
        grp.items.push(sb);
      });
      return groups.map(grp => {
        const opts = grp.items.map(sb => `<option value="${sb.id}" ${sb.id === p.subBookId ? 'selected' : ''}>${sb.name}</option>`).join('');
        return grp.g ? `<optgroup label="${grp.g}">${opts}</optgroup>` : opts;
      }).join('');
    }

    function renderRangePicker(track, subBook) {
      if (subBook.gAll || subBook.fullUnits < 2) return '';
      const full = subBook.fullUnits;
      const labelled = subBook.kind === 'gemara' || subBook.kind === 'mishnah' || subBook.kind === 'chapters' || full <= 400;
      if (!labelled) return '';
      const mk = (sel) => {
        let out = '';
        for (let i = 1; i <= full; i++) out += `<option value="${i}" ${i === sel ? 'selected' : ''}>${unitLabelAt(track, subBook, i)}</option>`;
        return out;
      };
      const isFull = subBook.rangeFrom === 1 && subBook.rangeTo === full;
      return `
        <div class="space-y-2 pt-1">
          <label class="text-xs font-bold app-text-muted block">טווח לימוד (רשות) - ${isFull ? 'כרגע: הכול' : 'כרגע: ' + subBook.units + ' ' + track.unitPlural}:</label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="text-[11px] font-bold app-text-muted mb-1">מ:</div>
              <select onchange="setPlannerRange('from', this.value)" class="w-full rounded-2xl p-3 text-sm font-bold app-card-alt focus:outline-none">${mk(subBook.rangeFrom)}</select>
            </div>
            <div>
              <div class="text-[11px] font-bold app-text-muted mb-1">עד:</div>
              <select onchange="setPlannerRange('to', this.value)" class="w-full rounded-2xl p-3 text-sm font-bold app-card-alt focus:outline-none">${mk(subBook.rangeTo)}</select>
            </div>
          </div>
          ${isFull ? '' : `<button onclick="setPlannerRange('all', 0)" class="w-full py-2.5 rounded-2xl app-btn-secondary font-bold text-xs">נקה טווח - כל הספר</button>`}
        </div>`;
    }

    function setPlannerRange(which, val) {
      const track = state.tracks.find(t => t.id === state.plannerSelectedTrackId);
      if (!track) return;
      const sb = getSelectedSubBook(track);
      let from = sb.rangeFrom, to = sb.rangeTo;
      const v = parseInt(val, 10);
      if (which === 'all') { from = 1; to = sb.fullUnits; }
      if (which === 'from') { from = v; if (to < from) to = from; }
      if (which === 'to') { to = v; if (from > to) from = to; }
      track.pace.rangeFrom = from;
      track.pace.rangeTo = to;
      resetPaceStart(track);
      saveState();
      renderCurrentPage();
      showToast('הטווח עודכן - הלימוד מתחיל מ' + unitLabelAt(track, sb, from));
    }

    async function fetchLiveSefariaText(ref) {
      showToast('טוען טקסט מלא ממאגר ספריא... 🌐');
      try {
        const resp = await fetch(`https://www.sefaria.org/api/texts/${encodeURIComponent(ref)}?context=0`);
        if (resp.ok) {
          const data = await resp.json();
          const rawHe = data.he;
          const flat = [];
          const extract = (node) => {
            if (typeof node === 'string') {
              const clean = node.replace(/<[^>]*>/g, '').trim();
              if (clean) flat.push(clean);
            } else if (Array.isArray(node)) {
              node.forEach(extract);
            }
          };
          extract(rawHe);
          if (flat.length > 0) {
            state.liveTextCache[ref] = flat.slice(0, 25);
            renderCurrentPage();
            showToast('הטקסט המלא נטען מספריא בהצלחה! 📖');
            return;
          }
        }
      } catch (e) {}
      showToast('מוצג הטקסט המובנה באפליקציה (ללא חיבור חיצוני)');
    }

    // ==================== 7. מנוע תזכורות אמיתי (Google Calendar, קובץ .ics, Web Notifications וצליל) ====================
    function playChimeSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.6);
        });
      } catch (e) {}
    }

    function getUncompletedSummaryText() {
      const todayKey = toDateKey(new Date());
      const coreTracks = state.tracks.filter(t => t.enabled && t.isCore);
      const pending = coreTracks.filter(t => !state.completedMap[`${todayKey}::${t.id}`]);
      if (pending.length === 0) {
        return 'אשריך! השלמת את כל לימודי הליבה של היום!';
      }
      const names = pending.slice(0, 4).map(t => t.titleHe.split('–')[0].trim()).join(', ');
      return `נותרו ${pending.length} לימודי ליבה להיום: ${names}`;
    }

    function fireDailyReminderNow(isTest = false) {
      playChimeSound();
      const summary = getUncompletedSummaryText();
      showToast(`🔔 תזכורת לימוד יומי: ${summary}`);

      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('📖 הגיע זמן הלימוד היומי שלך!', {
            body: summary,
            dir: 'rtl',
            lang: 'he-IL'
          });
        } catch (e) {}
      }
      if (!isTest) {
        state.lastReminderFiredDate = toDateKey(new Date());
        saveState(true);
      }
    }

    async function enableAndTestBrowserNotification() {
      playChimeSound();
      if (!('Notification' in window)) {
        showToast('🔔 צליל התראה הופעל! (לחיבור קבוע בטלפון מומלץ להוסיף ליומן למטה)');
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        renderCurrentPage();
        if (perm === 'granted') {
          fireDailyReminderNow(true);
        } else {
          showToast('🔔 צליל הופעל! לקבלת התראות גם כשהדפדפן סגור – לחץ על כפתור היומן למטה');
        }
      } catch (e) {
        fireDailyReminderNow(true);
      }
    }

    function openGoogleCalendarRecurringReminder() {
      const [hh, mm] = (state.reminderTime || '20:30').split(':').map(Number);
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh || 20, mm || 30, 0);
      if (start < now) start.setDate(start.getDate() + 1);
      const end = new Date(start.getTime() + 25 * 60000);

      const fmtCalDate = (d) => {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      };

      const coreNames = state.tracks.filter(t => t.enabled && t.isCore).map(t => `• ${t.titleHe}`).join('\n');
      const appUrl = window.location.href.split('?')[0] + (state.syncUserId ? `?sync=${encodeURIComponent(state.syncUserId)}` : '');
      const details = `קביעות יומית בתורה!\n\nמסלולי הליבה שלי:\n${coreNames}\n\nכניסה ישירה לאפליקציה:\n${appUrl}`;

      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('📖 הלימוד היומי שלי')}&dates=${fmtCalDate(start)}/${fmtCalDate(end)}&details=${encodeURIComponent(details)}&recur=${encodeURIComponent('RRULE:FREQ=DAILY')}`;
      window.open(gcalUrl, '_blank', 'noopener');
      showToast('נפתח Google Calendar ליצירת התראה יומית קבועה בטלפון! 📅');
    }

    function downloadIcsAlarmFile() {
      const [hh, mm] = (state.reminderTime || '20:30').split(':').map(Number);
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh || 20, mm || 30, 0);
      const end = new Date(start.getTime() + 25 * 60000);
      const pad = (n) => String(n).padStart(2, '0');
      const fmtLocal = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

      const appUrl = window.location.href.split('?')[0] + (state.syncUserId ? `?sync=${encodeURIComponent(state.syncUserId)}` : '');
      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Limud Yomi//HE',
        'BEGIN:VEVENT',
        `UID:limud-yomi-${Date.now()}@app`,
        `DTSTAMP:${fmtLocal(now)}Z`,
        `DTSTART:${fmtLocal(start)}`,
        `DTEND:${fmtLocal(end)}`,
        'RRULE:FREQ=DAILY',
        'SUMMARY:📖 הלימוד היומי שלי',
        `DESCRIPTION:הגיע זמן הקביעות היומית בתורה! פתח את האפליקציה: ${appUrl}`,
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:📖 הגיע זמן הלימוד היומי שלך!',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `limud-yomi-${(state.reminderTime || '2030').replace(':', '')}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('קובץ ההתראה היומית (.ics) ירד! פתח אותו להפעלה ביומן הטלפון ⏰');
    }

    function startReminderDaemon() {
      setInterval(() => {
        if (!state.reminderEnabled || !state.reminderTime) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const currentHM = `${hh}:${mm}`;
        const todayKey = toDateKey(now);
        if (currentHM === state.reminderTime && state.lastReminderFiredDate !== todayKey) {
          fireDailyReminderNow(false);
        }
      }, 20000);
    }

    // ==================== 8. מנוע סנכרון ענן אמיתי בין מכשירים (Cloud Sync) ====================
    function sanitizeSyncTopic(userId) {
      const clean = String(userId || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
      return clean ? `limud_yomi_sync_v3_${clean}` : '';
    }

    function generateRandomSyncId() {
      const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      let suffix = '';
      for (let i = 0; i < bytes.length; i++) suffix += alphabet[bytes[i] % alphabet.length];
      const newId = `limud-${suffix}`;
      const inputEl = document.getElementById('syncUserIdInput');
      if (inputEl) inputEl.value = newId;
      state.syncUserId = newId;
      saveState(true);
      pushStateToCloud(false);
    }

    function saveSyncIdAndPush() {
      const inputEl = document.getElementById('syncUserIdInput');
      const val = inputEl ? inputEl.value.trim() : state.syncUserId;
      if (!val) {
        showToast('אנא הקלד מזהה סנכרון אישי או לחץ על "צור קוד" ☁️');
        return;
      }
      state.syncUserId = val;
      saveState(true);
      pushStateToCloud(false);
    }

    async function pushStateToCloud(silent = false) {
      if (!state.syncUserId) return;
      const topic = sanitizeSyncTopic(state.syncUserId);
      if (!topic) return;

      if (!silent) {
        state.syncStatusMsg = 'מגבה נתונים לענן... ⏳';
        renderCurrentPage();
      }

      try {
        const payload = buildSyncPayload();
        // שלב 1: שמירת ה-JSON המלא ב-bytebin
        const postResp = await fetch('https://bytebin.lucko.me/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!postResp.ok) throw new Error('bytebin error');
        const postData = await postResp.json();
        const cloudKey = postData.key;

        // שלב 2: עדכון המצביע בערוץ האישי ב-ntfy.sh כדי שכל מכשיר אחר ימצא אותו מיד לפי המזהה האישי
        await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: JSON.stringify({
            cloudKey,
            updatedAt: payload.updatedAt,
            syncUserId: state.syncUserId
          })
        });

        const now = new Date();
        state.lastCloudKey = cloudKey;
        state.lastSyncTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        state.syncStatusMsg = `מסונכרן לענן ✓ (קוד: ${cloudKey})`;
        saveState(true);
        if (state.currentPage === 'settings') renderCurrentPage();
        if (!silent) showToast('כל הנתונים, הרצף והחידושים גובו לענן בהצלחה! ☁️✓');
      } catch (e) {
        state.syncStatusMsg = 'שמור מקומית (ממתין לחיבור רשת)';
        if (state.currentPage === 'settings') renderCurrentPage();
        if (!silent) showToast('שגיאת רשת בגיבוי לענן – הנתונים שמורים מקומית');
      }
    }

    function mergeCloudPayload(cloud) {
      if (!cloud || typeof cloud !== 'object') return;

      // 1. מיזוג כל הימים שסומנו כ"למדתי" משני המכשירים (כדי שהרצף לעולם לא יימחק!)
      if (cloud.completedMap && typeof cloud.completedMap === 'object') {
        Object.keys(cloud.completedMap).forEach(k => {
          if (cloud.completedMap[k]) state.completedMap[k] = true;
        });
      }

      // 2. מיזוג מחברת החידושים ללא כפילויות
      if (Array.isArray(cloud.notes)) {
        const existingIds = new Set(state.notes.map(n => String(n.id)));
        cloud.notes.forEach(n => {
          if (n && !existingIds.has(String(n.id))) {
            state.notes.push(n);
            existingIds.add(String(n.id));
          }
        });
        state.notes.sort((a, b) => (b.id || 0) - (a.id || 0));
      }

      // 3. עדכון הגדרות ספרים וקצב סיום
      if (Array.isArray(cloud.tracks)) {
        const cloudTracksMap = {};
        cloud.tracks.forEach(t => { cloudTracksMap[t.id] = t; });
        state.tracks = state.tracks.map(t => {
          const ct = cloudTracksMap[t.id];
          if (!ct) return t;
          return {
            ...t,
            enabled: ct.enabled !== undefined ? ct.enabled : t.enabled,
            isCore: ct.isCore !== undefined ? ct.isCore : t.isCore,
            order: ct.order !== undefined ? ct.order : t.order,
            pace: { ...t.pace, ...(ct.pace || {}) }
          };
        }).sort((a, b) => a.order - b.order);
        state.tracks.forEach(syncUnitNames);
      }

      if (cloud.themeMode) state.themeMode = cloud.themeMode;
      if (cloud.readerFontSize) state.readerFontSize = cloud.readerFontSize;
      if (cloud.reminderTime) state.reminderTime = cloud.reminderTime;
      applyThemeToDOM();
    }

    async function pullStateFromCloud(silent = false) {
      const inputEl = document.getElementById('syncUserIdInput');
      if (inputEl && inputEl.value.trim()) {
        state.syncUserId = inputEl.value.trim();
      }
      if (!state.syncUserId) {
        if (!silent) showToast('הזן תחילה את מזהה הסנכרון האישי שלך ☁️');
        return;
      }

      const topic = sanitizeSyncTopic(state.syncUserId);
      if (!silent) {
        state.syncStatusMsg = 'מושך נתונים מהענן... ⏳';
        renderCurrentPage();
      }

      try {
        const pollResp = await fetch(`https://ntfy.sh/${topic}/json?poll=1`);
        if (!pollResp.ok) throw new Error('poll failed');
        const text = await pollResp.text();
        const lines = text.trim().split('\n').filter(Boolean);
        let latestKey = null;

        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt.event === 'message' && evt.message) {
              const msgObj = JSON.parse(evt.message);
              if (msgObj && msgObj.cloudKey) {
                latestKey = msgObj.cloudKey;
                break;
              }
            }
          } catch (_) {}
        }

        if (!latestKey) {
          state.syncStatusMsg = 'טרם נמצא גיבוי למזהה זה – יוצר גיבוי ראשוני...';
          await pushStateToCloud(silent);
          return;
        }

        const dataResp = await fetch(`https://bytebin.lucko.me/${latestKey}`);
        if (!dataResp.ok) throw new Error('snapshot fetch failed');
        const cloudPayload = await dataResp.json();

        mergeCloudPayload(cloudPayload);
        const now = new Date();
        state.lastCloudKey = latestKey;
        state.lastSyncTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        state.syncStatusMsg = `סונכרן מהענן בהצלחה ✓ (${latestKey})`;
        saveState(true);
        renderCurrentPage();
        if (!silent) showToast('הנתונים, הרצף ומחברת החידושים סונכרנו מהענן! 🎉');
      } catch (e) {
        state.syncStatusMsg = 'לא ניתן היה למשוך מהענן כעת';
        if (state.currentPage === 'settings') renderCurrentPage();
        if (!silent) showToast('לא נמצא גיבוי או שאין חיבור רשת כרגע');
      }
    }

    function copyMagicSyncLink() {
      if (!state.syncUserId) return;
      const baseUrl = window.location.href.split('?')[0];
      const magicUrl = `${baseUrl}?sync=${encodeURIComponent(state.syncUserId)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(magicUrl).then(() => {
          showToast('הקישור האישי הועתק! שלח אותו לטלפון החדש שלך 🔗');
        }).catch(() => {
          prompt('העתק את הקישור האישי שלך:', magicUrl);
        });
      } else {
        prompt('העתק את הקישור האישי שלך:', magicUrl);
      }
    }

    function exportBackupJsonFile() {
      const dataStr = JSON.stringify(buildSyncPayload(), null, 2);
      const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `limud-yomi-backup-${toDateKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('קובץ הגיבוי (.json) הורד למכשיר שלך 📥');
    }

    function importBackupJsonFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          mergeCloudPayload(parsed);
          saveState();
          renderCurrentPage();
          showToast('הגיבוי שוחזר ומוזג בהצלחה! 🎉');
        } catch (_) {
          showToast('קובץ הגיבוי אינו תקין');
        }
      };
      reader.readAsText(file);
    }

    // אתחול ראשוני
    loadState();
    tryFetchSefariaCalendar(state.selectedDateStr);
    startReminderDaemon();
    renderCurrentPage();
    if (state.syncUserId) {
      pullStateFromCloud(true);
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
